# Use when Prometheus runs in Docker but Cortex and metrics server run on host.
# Run: docker run -d --name prometheus -p 9093:9090 --add-host=host.docker.internal:host-gateway \
#   -v "$(pwd)/prometheus-standalone.yml:/etc/prometheus/prometheus.yml" \
#   prom/prometheus:latest --config.file=/etc/prometheus/prometheus.yml
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: test
    static_configs:
      - targets: ["host.docker.internal:9090"]

remote_write:
  - url: http://host.docker.internal:9009/api/v1/push
    headers:
      X-Scope-OrgID: demo
