# Working Cortex configuration for local testing
target: all

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: info

# Configure alertmanager with external URL
alertmanager:
  external_url: http://localhost:9009/alertmanager
  data_dir: /tmp/cortex-alertmanager
  enable_api: true
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: inmemory

# Alertmanager storage (use local instead of S3)
alertmanager_storage:
  backend: local
  local:
    path: /tmp/cortex-alertmanager

# Use filesystem storage for blocks
storage:
  engine: blocks

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /tmp/cortex-data
  tsdb:
    dir: /tmp/cortex-tsdb
  bucket_store:
    sync_dir: /tmp/cortex-sync

# Ingester configuration
ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    num_tokens: 128
    heartbeat_period: 5s
    join_after: 0s
    min_ready_duration: 0s
    final_sleep: 0s

# Distributor configuration
distributor:
  pool:
    health_check_ingesters: true

# Compactor configuration
compactor:
  data_dir: /tmp/cortex-compactor
  sharding_ring:
    kvstore:
      store: inmemory

# Store gateway configuration
store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: inmemory

# Ruler configuration (use local storage)
ruler:
  enable_api: true
  rule_path: /tmp/cortex-rules
  ring:
    kvstore:
      store: inmemory

ruler_storage:
  backend: local
  local:
    directory: /tmp/cortex-rules

# Limits
limits:
  ingestion_rate: 100000
  ingestion_burst_size: 200000
