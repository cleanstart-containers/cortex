# Use with docker-compose: scrape metrics service.
# remote_write to Cortex is disabled: the Cortex base image has a label-encoding
# mismatch with Prometheus remote write that causes ingester panics.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: test
    static_configs:
      - targets: ["metrics:9090"]

